<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05070d" />

    <!-- Aplica tema, idioma y fondo guardados ANTES de pintar (evita parpadeo) -->
    <script>
      (function () {
        var d = document.documentElement, t = null, l = null, b = null;
        try { t = localStorage.getItem('theme'); l = localStorage.getItem('lang'); b = localStorage.getItem('bg'); } catch (e) {}
        if (t === 'light') d.classList.add('light');
        if (l !== 'es' && l !== 'en') {
          l = ((navigator.language || 'es').toLowerCase().indexOf('es') === 0) ? 'es' : 'en';
        }
        d.lang = l;
        d.dataset.bg = b === 'photo' ? 'photo' : 'aurora';
      })();
    </script>

    <title>Carlos Cantos | Automation & AI Developer</title>
    <meta name="description" content="Desarrollador de automatización e IA en Valencia. Fundador de Ponent Labs. Diseño flujos con n8n, integro LLMs y despliego sistemas en producción." />
